name: 不生效 / 状态判断错误
description: 报告某型号未生效、状态判断反了，或日志里出现异常帧
title: "[不生效] <耳机型号> - <一句话描述>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认一个前提：**把耳机放回底座后，耳机是否会播报"关机"？**
        如果耳机放回底座后仍保持开机在线，底座推送的状态不会变化，本工具无法生效。

  - type: input
    id: model
    attributes:
      label: 耳机型号
      placeholder: 例如 HECATE G5 MAX 底座版
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统版本
      description: 运行 `winver` 或 `Get-ComputerInfo | Select WindowsProductName,WindowsVersion,OsBuildNumber`
      placeholder: Windows 11 25H2 Build 26200.9711
    validations:
      required: true

  - type: dropdown
    id: behavior
    attributes:
      label: 具体现象
      options:
        - 完全不切换
        - 拿起/放下的判断反了
        - 切一次之后就卡住不动
        - 切换后没有声音
        - 其他（在下面补充）
    validations:
      required: true

  - type: textarea
    id: probe
    attributes:
      label: probe 输出
      description: 运行 `G5DockSwitch.exe --probe`，把 `probe.txt` 的内容贴在这里
      render: text
    validations:
      required: true

  - type: textarea
    id: capture
    attributes:
      label: capture 日志（可选但强烈建议）
      description: |
        运行 `G5DockSwitch.exe --capture 60`，期间反复"拿起耳机 → 放回底座"两到三次，
        然后把 `capture.log` 的关键行贴在这里。
      render: text
    validations:
      required: false

  - type: input
    id: hardware
    attributes:
      label: 设备 ID
      description: 设备管理器 → 该耳机 → 属性 → 详细信息 → 设备实例路径
      placeholder: USB\VID_35BB&PID_A228\...
    validations:
      required: false
